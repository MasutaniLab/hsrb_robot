/angle_sensors_alignment:
  ros__parameters:
    head_tilt_joint:
      motor_id: 32
      default_drive_mode: 5
      need_alignment: True
      alignment_pos: 0.0
    head_pan_joint:
      motor_id: 31
      default_drive_mode: 5
      need_alignment: True
      alignment_pos: 0.0
    arm_lift_joint:
      motor_id: 21
      default_drive_mode: 5
      need_alignment: True
      alignment_pos: 0.01
    arm_flex_joint:
      motor_id: 22
      default_drive_mode: 8
    arm_roll_joint:
      motor_id: 23
      default_drive_mode: 5
    wrist_flex_joint:
      motor_id: 24
      default_drive_mode: 5
    wrist_roll_joint:
      motor_id: 25
      default_drive_mode: 7
    base_r_drive_wheel_joint:
      motor_id: 12
      default_drive_mode: 3
    base_l_drive_wheel_joint:
      motor_id: 11
      default_drive_mode: 3
    base_roll_joint:
      motor_id: 11
      default_drive_mode: 3
    joints:
      - head_tilt_joint
      - head_pan_joint
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - base_r_drive_wheel_joint
      - base_l_drive_wheel_joint
      - base_roll_joint
    head_trajectory_controller:
      joints:
        - head_tilt_joint
        - head_pan_joint
    arm_trajectory_controller:
      joints:
        - arm_lift_joint
        - arm_flex_joint
        - arm_roll_joint
        - wrist_flex_joint
        - wrist_roll_joint
